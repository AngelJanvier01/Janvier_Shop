name: janvier-v2

x-janvier-environment: &janvier_environment
  AUTH_SECRET: ${AUTH_SECRET}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
  JANVIER_TIMEZONE: ${JANVIER_TIMEZONE:-America/Mexico_City}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  NODE_ENV: production
  PROPOSAL_ASSET_STORAGE_DRIVER: local
  PROPOSAL_ASSET_STORAGE_PATH: /var/lib/janvier/proposal-assets

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    volumes:
      - janvier_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run db:bootstrap
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *janvier_environment
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
    profiles: ["maintenance"]
    restart: "no"
    volumes:
      - janvier_proposal_assets:/var/lib/janvier/proposal-assets

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    depends_on:
      database:
        condition: service_healthy
    environment: *janvier_environment
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001,mode=0700
    volumes:
      - janvier_proposal_assets:/var/lib/janvier/proposal-assets

volumes:
  janvier_postgres:
  janvier_proposal_assets:
