name: janvier-v2

x-janvier-environment: &janvier_environment
  AUTH_SECRET: ${AUTH_SECRET}
  APP_URL: ${APP_URL:-${NEXT_PUBLIC_SITE_URL}}
  TRUST_PROXY_CLIENT_IP: ${TRUST_PROXY_CLIENT_IP:-false}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
  JANVIER_TIMEZONE: ${JANVIER_TIMEZONE:-America/Mexico_City}
  TZ: ${JANVIER_TIMEZONE:-America/Mexico_City}
  MAIL_ENABLED: ${MAIL_ENABLED:-false}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
  CUSTOMER_EMAIL_DELIVERY_WEBHOOK_SECRET: ${CUSTOMER_EMAIL_DELIVERY_WEBHOOK_SECRET:-}
  CUSTOMER_EMAIL_DELIVERY_WEBHOOK_URL: ${CUSTOMER_EMAIL_DELIVERY_WEBHOOK_URL:-}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
  MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
  MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
  NODE_ENV: production
  BACKGROUND_REMOVAL_URL: http://background-removal:8080
  PRODUCT_IMAGE_MAX_SOURCE_BYTES: ${PRODUCT_IMAGE_MAX_SOURCE_BYTES:-20971520}
  PRODUCT_IMAGE_SOURCE_HOSTS: ${PRODUCT_IMAGE_SOURCE_HOSTS:-janvier01.sicodd.com.mx}
  PRODUCT_IMAGE_STORAGE_PATH: /var/lib/janvier/product-images
  PRODUCT_IMAGE_WORKER_ENABLED: ${PRODUCT_IMAGE_WORKER_ENABLED:-false}
  PROPOSAL_ASSET_STORAGE_DRIVER: local
  PROPOSAL_ASSET_STORAGE_PATH: /var/lib/janvier/proposal-assets
  SICODD_ADMIN_PASSWORD: ${SICODD_ADMIN_PASSWORD:-}
  SICODD_BASE_URL: ${SICODD_BASE_URL:-}
  SICODD_PUBLIC_WAREHOUSES: ${SICODD_PUBLIC_WAREHOUSES:-}
  SICODD_USERNAME: ${SICODD_USERNAME:-}
  SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
  GOOGLE_ALLOWED_EMAIL: ${GOOGLE_ALLOWED_EMAIL:-}
  GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
  GOOGLE_OAUTH_PUBLISHING_STATUS: ${GOOGLE_OAUTH_PUBLISHING_STATUS:-testing}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    volumes:
      - janvier_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run db:bootstrap
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *janvier_environment
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      MP_PUBLIC_KEY: ""
      MP_ACCESS_TOKEN: ""
      MP_WEBHOOK_SECRET: ""
    profiles: ["maintenance"]
    restart: "no"
    volumes:
      - janvier_proposal_assets:/var/lib/janvier/proposal-assets
      - janvier_product_images:/var/lib/janvier/product-images

  background-removal:
    build:
      context: services/background-removal
      dockerfile: Dockerfile
    environment:
      MODEL_ID: ${BACKGROUND_MODEL_ID:-ZhengPeng7/BiRefNet_lite}
      MODEL_INPUT_SIZE: ${BACKGROUND_MODEL_INPUT_SIZE:-1536}
      MODEL_REVISION: ${BACKGROUND_MODEL_REVISION:-7838f1c3472f827cd8ce13ab5ccc2ce48077360f}
      MODEL_THREADS: ${BACKGROUND_MODEL_THREADS:-2}
      MASK_GUARD_COLOR_TOLERANCE: ${BACKGROUND_MASK_GUARD_COLOR_TOLERANCE:-32}
      MASK_GUARD_ENABLED: ${BACKGROUND_MASK_GUARD_ENABLED:-true}
      MASK_GUARD_MIN_DOMINANT_BORDER: ${BACKGROUND_MASK_GUARD_MIN_DOMINANT_BORDER:-0.85}
      MASK_GUARD_MIN_LIGHT_BORDER: ${BACKGROUND_MASK_GUARD_MIN_LIGHT_BORDER:-0.20}
      MASK_GUARD_SEED_ALPHA: ${BACKGROUND_MASK_GUARD_SEED_ALPHA:-144}
      MASK_GUARD_SIZE: ${BACKGROUND_MASK_GUARD_SIZE:-512}
      MASK_COMPLEX_MIN_VISIBLE_RATIO: ${BACKGROUND_MASK_COMPLEX_MIN_VISIBLE_RATIO:-0.18}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    volumes:
      - janvier_background_models:/models/huggingface

  image-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run images:worker
    depends_on:
      background-removal:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      <<: *janvier_environment
      BACKGROUND_REMOVAL_URL: http://background-removal:8080
      JANVIER_OPERATIONS_STORAGE_SCOPE: product-images
      MP_PUBLIC_KEY: ""
      MP_ACCESS_TOKEN: ""
      MP_WEBHOOK_SECRET: ""
      PRODUCT_IMAGE_STORAGE_PATH: /var/lib/janvier/product-images
      PRODUCT_IMAGE_WORKER_ENABLED: "true"
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    volumes:
      - janvier_product_images:/var/lib/janvier/product-images

  sicodd-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run sicodd:worker
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *janvier_environment
      JANVIER_OPERATIONS_STORAGE_SCOPE: sicodd-sync
      MP_PUBLIC_KEY: ""
      MP_ACCESS_TOKEN: ""
      MP_WEBHOOK_SECRET: ""
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m

  payment-expiration-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run payments:expire-spei
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *janvier_environment
      JANVIER_OPERATIONS_STORAGE_SCOPE: sicodd-sync
      MP_PUBLIC_KEY: ""
      MP_ACCESS_TOKEN: ""
      MP_WEBHOOK_SECRET: ""
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    depends_on:
      database:
        condition: service_healthy
    environment: *janvier_environment
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1001,gid=1001
    volumes:
      - janvier_proposal_assets:/var/lib/janvier/proposal-assets
      - janvier_product_images:/var/lib/janvier/product-images:ro

volumes:
  janvier_background_models:
  janvier_postgres:
  janvier_product_images:
  janvier_proposal_assets:
