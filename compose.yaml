name: janvier-v2

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    volumes:
      - janvier_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run db:bootstrap
    depends_on:
      database:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-https://example.com}
      TRUST_PROXY_CLIENT_IP: ${TRUST_PROXY_CLIENT_IP:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      CUSTOMER_EMAIL_DELIVERY_WEBHOOK_SECRET: ${CUSTOMER_EMAIL_DELIVERY_WEBHOOK_SECRET:-}
      CUSTOMER_EMAIL_DELIVERY_WEBHOOK_URL: ${CUSTOMER_EMAIL_DELIVERY_WEBHOOK_URL:-}
      TZ: ${JANVIER_TIMEZONE:-America/Mexico_City}
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT}
      BACKGROUND_REMOVAL_URL: http://background-removal:8080
      PRODUCT_IMAGE_MAX_SOURCE_BYTES: ${PRODUCT_IMAGE_MAX_SOURCE_BYTES:-20971520}
      PRODUCT_IMAGE_SOURCE_HOSTS: ${PRODUCT_IMAGE_SOURCE_HOSTS:-janvier01.sicodd.com.mx}
      PRODUCT_IMAGE_STORAGE_PATH: /var/lib/janvier/product-images
      PROPOSAL_ASSET_STORAGE_DRIVER: ${PROPOSAL_ASSET_STORAGE_DRIVER:-local}
      PROPOSAL_ASSET_STORAGE_PATH: ${PROPOSAL_ASSET_STORAGE_PATH:-/var/lib/janvier/proposal-assets}
      SICODD_ADMIN_PASSWORD: ${SICODD_ADMIN_PASSWORD:-}
      SICODD_BASE_URL: ${SICODD_BASE_URL:-}
      SICODD_USERNAME: ${SICODD_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      GOOGLE_ALLOWED_EMAIL: ${GOOGLE_ALLOWED_EMAIL:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      GOOGLE_OAUTH_PUBLISHING_STATUS: ${GOOGLE_OAUTH_PUBLISHING_STATUS:-testing}
    profiles: ["maintenance"]
    volumes:
      - janvier_product_images:/var/lib/janvier/product-images

  background-removal:
    build:
      context: services/background-removal
      dockerfile: Dockerfile
    environment:
      MODEL_ID: ${BACKGROUND_MODEL_ID:-ZhengPeng7/BiRefNet_lite}
      MODEL_REVISION: ${BACKGROUND_MODEL_REVISION:-7838f1c3472f827cd8ce13ab5ccc2ce48077360f}
      MODEL_THREADS: ${BACKGROUND_MODEL_THREADS:-2}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    volumes:
      - janvier_background_models:/models/huggingface

  image-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run images:worker
    depends_on:
      background-removal:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      BACKGROUND_REMOVAL_URL: http://background-removal:8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      JANVIER_OPERATIONS_STORAGE_SCOPE: product-images
      PRODUCT_IMAGE_MAX_SOURCE_BYTES: ${PRODUCT_IMAGE_MAX_SOURCE_BYTES:-20971520}
      PRODUCT_IMAGE_SOURCE_HOSTS: ${PRODUCT_IMAGE_SOURCE_HOSTS:-janvier01.sicodd.com.mx}
      PRODUCT_IMAGE_STORAGE_PATH: /var/lib/janvier/product-images
      PRODUCT_IMAGE_WORKER_ENABLED: "true"
    restart: unless-stopped
    volumes:
      - janvier_product_images:/var/lib/janvier/product-images

  sicodd-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run sicodd:worker
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      SICODD_ADMIN_PASSWORD: ${SICODD_ADMIN_PASSWORD:-}
      SICODD_BASE_URL: ${SICODD_BASE_URL:-}
      SICODD_USERNAME: ${SICODD_USERNAME:-}
    restart: unless-stopped

  payment-expiration-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run payments:expire-spei
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      JANVIER_OPERATIONS_STORAGE_SCOPE: sicodd-sync
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Desarrollo monta volúmenes persistentes para Next y node_modules. Docker
    # puede haberlos creado como root en una ejecución anterior; el servidor de
    # desarrollo los inicializa como root para no reiniciar en un ciclo EACCES.
    # La imagen de producción conserva su usuario no privilegiado `janvier`.
    user: "0:0"
    command: sh -c "npm ci --include=dev && npm run prisma:generate && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      database:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-https://example.com}
      TRUST_PROXY_CLIENT_IP: ${TRUST_PROXY_CLIENT_IP:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      CUSTOMER_EMAIL_DELIVERY_WEBHOOK_SECRET: ${CUSTOMER_EMAIL_DELIVERY_WEBHOOK_SECRET:-}
      CUSTOMER_EMAIL_DELIVERY_WEBHOOK_URL: ${CUSTOMER_EMAIL_DELIVERY_WEBHOOK_URL:-}
      TZ: ${JANVIER_TIMEZONE:-America/Mexico_City}
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      BACKGROUND_REMOVAL_URL: http://background-removal:8080
      PRODUCT_IMAGE_MAX_SOURCE_BYTES: ${PRODUCT_IMAGE_MAX_SOURCE_BYTES:-20971520}
      PRODUCT_IMAGE_SOURCE_HOSTS: ${PRODUCT_IMAGE_SOURCE_HOSTS:-janvier01.sicodd.com.mx}
      PRODUCT_IMAGE_STORAGE_PATH: /var/lib/janvier/product-images
      PRODUCT_IMAGE_WORKER_ENABLED: "false"
      PROPOSAL_ASSET_STORAGE_DRIVER: ${PROPOSAL_ASSET_STORAGE_DRIVER:-local}
      PROPOSAL_ASSET_STORAGE_PATH: ${PROPOSAL_ASSET_STORAGE_PATH:-/var/lib/janvier/proposal-assets}
      SICODD_ADMIN_PASSWORD: ${SICODD_ADMIN_PASSWORD:-}
      SICODD_BASE_URL: ${SICODD_BASE_URL:-}
      SICODD_USERNAME: ${SICODD_USERNAME:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      GOOGLE_ALLOWED_EMAIL: ${GOOGLE_ALLOWED_EMAIL:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      GOOGLE_OAUTH_PUBLISHING_STATUS: ${GOOGLE_OAUTH_PUBLISHING_STATUS:-testing}
    ports:
      - "${APP_PORT}:3001"
    restart: unless-stopped
    volumes:
      - .:/app
      - janvier_next:/app/.next
      - janvier_node_modules:/app/node_modules
      - janvier_proposal_assets:/var/lib/janvier/proposal-assets
      - janvier_product_images:/var/lib/janvier/product-images

volumes:
  janvier_background_models:
  janvier_next:
  janvier_node_modules:
  janvier_product_images:
  janvier_proposal_assets:
  janvier_postgres:
