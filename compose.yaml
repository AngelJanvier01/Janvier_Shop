name: janvier-v2

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    volumes:
      - janvier_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run db:bootstrap
    depends_on:
      database:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT}
    profiles: ["maintenance"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run prisma:generate && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      database:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT}
    ports:
      - "${APP_PORT}:3001"
    restart: unless-stopped
    volumes:
      - .:/app
      - janvier_next:/app/.next
      - janvier_node_modules:/app/node_modules

volumes:
  janvier_next:
  janvier_node_modules:
  janvier_postgres:
