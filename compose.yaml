name: janvier-v2

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    volumes:
      - janvier_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: npm run db:bootstrap
    depends_on:
      database:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-https://example.com}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      TZ: ${JANVIER_TIMEZONE:-America/Mexico_City}
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT}
      PROPOSAL_ASSET_STORAGE_DRIVER: ${PROPOSAL_ASSET_STORAGE_DRIVER:-local}
      PROPOSAL_ASSET_STORAGE_PATH: ${PROPOSAL_ASSET_STORAGE_PATH:-/var/lib/janvier/proposal-assets}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
    profiles: ["maintenance"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm ci --include=dev && npm run prisma:generate && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      database:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-https://example.com}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      TZ: ${JANVIER_TIMEZONE:-America/Mexico_City}
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT}
      PROPOSAL_ASSET_STORAGE_DRIVER: ${PROPOSAL_ASSET_STORAGE_DRIVER:-local}
      PROPOSAL_ASSET_STORAGE_PATH: ${PROPOSAL_ASSET_STORAGE_PATH:-/var/lib/janvier/proposal-assets}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
    ports:
      - "${APP_PORT}:3001"
    restart: unless-stopped
    volumes:
      - .:/app
      - janvier_next:/app/.next
      - janvier_node_modules:/app/node_modules
      - janvier_proposal_assets:/var/lib/janvier/proposal-assets

volumes:
  janvier_next:
  janvier_node_modules:
  janvier_proposal_assets:
  janvier_postgres:
